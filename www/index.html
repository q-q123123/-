<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="体重趋势">
<meta name="description" content="记录晨起体重、训练后体重与腰围，计算周平均变化速度并预测趋势。数据只保存在本机。">
<title>体重趋势</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">体重趋势</div>
    <div id="topMeta"></div>
  </header>
  <div id="updateBar" class="update-bar" hidden>
    <span>有新版本可用</span>
    <button class="btn small primary" data-act="apply-update">刷新</button>
  </div>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="record" class="active">记录</button>
    <button data-tab="trend">趋势</button>
    <button data-tab="analysis">分析</button>
    <button data-tab="settings">设置</button>
  </nav>
  <div id="toast" class="toast"></div>
</div>
<script src="js/format.js"></script>
<script src="js/stats.js"></script>
<script src="js/store.js"></script>
