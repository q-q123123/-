<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>更新 体重趋势</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b1220; color: #e7eefc;
         font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .box { text-align: center; padding: 24px; max-width: 320px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
  p { font-size: 14px; color: #8fa2c0; line-height: 1.7; margin: 0; }
  .ok { color: #34d399; }
  button { margin-top: 18px; padding: 12px 22px; border-radius: 12px; border: 0;
           background: #22d3ee; color: #04212b; font-size: 15px; font-weight: 700; font-family: inherit; }
</style>
</head>
<body>
<div class="box">
  <h1 id="title">正在清除旧缓存…</h1>
  <p id="msg">你的体重记录存在另一个地方，<b>不会受影响</b>。</p>
  <button id="go" hidden>打开新版</button>
</div>
<script>
(function () {
  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  var go = document.getElementById('go');

  function openApp() {
    location.replace('./index.html?r=' + Date.now());
  }

  function fail(e) {
    title.textContent = '需要手动刷新一次';
    msg.textContent = '点下面的按钮，或在浏览器里下拉刷新。记录不会丢。';
    go.hidden = false;
    go.onclick = openApp;
  }

  go.onclick = openApp;

  try {
    var tasks = [];
    if ('serviceWorker' in navigator) {
      tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }));
    }
    if (window.caches && caches.keys) {
      tasks.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }));
    }
    Promise.all(tasks).then(function () {
      title.textContent = '已更新';
      title.className = 'ok';
      msg.textContent = '正在打开最新版本…';
      setTimeout(openApp, 500);
    }).catch(fail);
  } catch (e) {
    fail(e);
  }
})();
</script>
</body>
</html>
